name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check public release surface
        run: bash scripts/check-public-release.sh
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.15
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build web
        run: pnpm build
        working-directory: web
      - name: Reject high-severity JavaScript advisories
        run: pnpm audit --audit-level high
        working-directory: web
      - name: Install API dependencies
        run: uv sync --locked
        working-directory: api
      - name: Test API and publishing plugin
        run: uv run python -m unittest discover -s tests -v
        working-directory: api
        env:
          PRIVY_APP_ID: test-app
          MONGO_URL: mongodb://127.0.0.1:27017
          MONGO_DATABASE: eztudy_test
          EZ_BINDINGS_FILE: /tmp/eztudy-test-bindings.json
      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-package eztudy-publishing --output-file /tmp/eztudy-requirements.txt
          uvx pip-audit --requirement /tmp/eztudy-requirements.txt
        working-directory: api
      - name: Verify distributable plugin contents
        run: |
          npm pack --dry-run
          ! npm pack --dry-run 2>&1 | grep -E '(__pycache__|\.pyc$|\.env)'
        working-directory: plugin
