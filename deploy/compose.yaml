name: ${COMPOSE_PROJECT_NAME:-eztudy}
services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: ${API_IMAGE:-eztudy-api:0.1.1}
    user: "${API_UID:-1000}:${API_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - ${API_ENV_FILE:?Set the absolute path to the private API environment file}
    environment:
      EZ_BINDINGS_FILE: /run/secrets/ez-bindings.json
    ports: ["127.0.0.1:${API_PORT:-8111}:8111"]
    volumes:
      - ${EZ_BINDINGS_FILE:?Set the private Ez bindings file}:/run/secrets/ez-bindings.json:ro
      - ${EZ_TOKEN_DIR:?Set the private Ez token directory}:/run/secrets/ez-tokens:ro
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8111/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  relay:
    build:
      context: .
      dockerfile: Dockerfile.ez
      args:
        EZ_IMAGE: ${EZ_IMAGE:?Set the pinned Ez core image}
    image: ${EZ_RUNTIME_IMAGE:-eztudy-ez-native:local}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETPCAP, KILL]
    security_opt: [no-new-privileges:true]
    environment:
      EZ_TELEGRAM_ENABLED: "false"
      EZ_EXECUTOR_TRANSPORT: host
      EZ_EXECUTOR_CLI: codex
      EZ_APPLICATION_PORT: "8787"
      EZ_APPLICATION_HOST: 0.0.0.0
      EZ_AGENT_WORKSPACE: ${EZ_STATE_DIR}/workspace
      EZ_CONTROL_DIR: /state/control
      EZ_REPAIR_ENABLED: "false"
    ports: ["127.0.0.1:${RELAY_PORT:-8788}:8787"]
    volumes:
      - ${EZ_STATE_DIR:?Set private runtime directory}/workspace:${EZ_STATE_DIR}/workspace
      - ${EZ_STATE_DIR}/control:/state/control
      - ${EZ_STATE_DIR}/home:/state/home
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, node, /app/docker/healthcheck.mjs]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
