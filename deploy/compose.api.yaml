# Standalone learning app; an Ez/Coach connection is optional.
name: ${COMPOSE_PROJECT_NAME:-ezstudy-app}
services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: ${API_IMAGE:?Set an immutable API image tag}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - ${API_ENV_FILE:?Set the private API environment file}
    ports: ["127.0.0.1:${API_PORT:-8111}:8111"]
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8111/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
